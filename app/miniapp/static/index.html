<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0d1828" />
    <meta name="description" content="Мастерская — личный кабинет студии йоги" />
    <title>Мастерская — студия йоги</title>
    <link rel="stylesheet" href="/miniapp/static/styles.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script defer src="/miniapp/static/app.js"></script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="identity">
          <span class="brand-mark" aria-hidden="true">✳</span>
          <div><strong>Мастерская</strong><span>пространство йоги</span></div>
        </div>
        <div class="profile" id="profile" aria-live="polite"><span class="profile-dot"></span>Подключение…</div>
      </header>

      <main id="main">
        <section class="hero" aria-labelledby="welcome-title">
          <div class="hero-glow" aria-hidden="true"></div>
          <p class="eyebrow">ВАШЕ ПРОСТРАНСТВО</p>
          <h1 id="welcome-title">Всё важное<br /><em>в одном месте</em></h1>
          <p class="hero-copy" id="greeting">Здесь будут ваши занятия, задачи и важные события.</p>
          <div class="hero-ornament" aria-hidden="true">◌</div>
        </section>

        <div id="status" class="notice" role="status" aria-live="polite">Проверяем доступ через Telegram…</div>

        <section id="workspace" class="workspace" hidden>
          <nav class="tabs" id="tabs" aria-label="Разделы приложения"></nav>
          <div id="section" class="section"></div>
        </section>
      </main>

      <footer class="footnote">МАСТЕРСКАЯ · С ЗАБОТОЙ О ВАШЕМ ВРЕМЕНИ</footer>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
