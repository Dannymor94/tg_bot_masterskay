[project]
name = "studio-bot"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiogram>=3,<4", "httpx>=0.28,<1", "sqlalchemy>=2,<3", "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2", "pydantic-settings>=2,<3", "pyyaml>=6,<7",
]

[dependency-groups]
dev = ["ruff", "pyright", "pytest", "respx"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["app", "tests", "alembic"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
